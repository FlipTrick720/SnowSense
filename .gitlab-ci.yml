# .gitlab-ci.yml

stages:
  - test

fitness-functions:
  stage: test
  image: eclipse-temurin:17-jdk
  script:
    - cd notification-backend
    - ./mvnw test -Dtest=ServiceCouplingFitnessFunctionTest --no-transfer-progress
  only:
    - dev
    - main
    - /^feature\/.*$/  # optional: run on feature branches too