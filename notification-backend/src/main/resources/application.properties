# Server Configuration
server.port=${SERVER_PORT:8080}

# Firebase Configuration
# Option 1: Path to your Firebase service account key JSON file (for local development)
# Download from: Firebase Console -> Project Settings -> Service Accounts -> Generate new private key
firebase.service-account-key-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Option 2: Base64 encoded service account key (for cloud deployment)
# Generate with: base64 -w 0 firebase-service-account.json
firebase.service-account-key-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# CORS Configuration
# Adjust for your frontend URL
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# Logging - REDUCED for memory efficiency
logging.level.root=WARN
logging.level.com.notification=INFO
logging.level.org.springframework.web=WARN

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:snowsense
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Connection pool optimization for Render (512MB memory limit)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Disable unnecessary features to save memory
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# H2 Console (for debugging - access at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize database with schema.sql and data.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Actuator - minimal endpoints for health checks
management.endpoints.web.exposure.include=health
